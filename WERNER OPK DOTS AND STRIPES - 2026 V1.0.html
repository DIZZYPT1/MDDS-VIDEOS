<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werner Institute | Clinical Visual Integration</title>
<style>
    :root {
        --primary-navy: #0a192f;
        --clinical-blue: #1e3a8a;
        --accent-red: #cc0000;
        --neutral-bg: #f8fafc;
        --text-main: #1e293b;
        --glass: rgba(255, 255, 255, 0.98);
    }

    body, html { 
        margin: 0; padding: 0; width: 100%; height: 100%; 
        background-color: #000; overflow: hidden; 
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    }

    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; cursor: pointer; }

    #setup-panel { 
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
        z-index: 100; background: var(--glass); 
        padding: 45px; border-radius: 12px; border: 1px solid #cbd5e1; 
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); width: 620px; color: var(--text-main);
    }

    h1 { margin: 0 0 15px 0; font-size: 42px; color: var(--primary-navy); font-weight: 800; text-align: center; letter-spacing: -1px; }
    
    .clinical-overview {
        font-size: 14px; line-height: 1.6; color: #475569; margin-bottom: 25px;
        text-align: left; padding: 18px; background: #fff; border-left: 8px solid var(--primary-navy);
        border-radius: 4px;
    }

    .control-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;
    }

    .control-item { display: flex; flex-direction: column; }
    label { font-weight: 700; font-size: 12px; margin-bottom: 6px; color: var(--primary-navy); text-transform: uppercase; }

    input, select { 
        font-size: 15px; padding: 10px; border: 2px solid #cbd5e1; border-radius: 6px; outline: none;
    }

    #start-btn { 
        padding: 22px; font-size: 24px; background-color: var(--primary-navy); 
        color: white; border: none; cursor: pointer; border-radius: 10px; 
        font-weight: 800; width: 100%;
    }

    #prep-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.98); z-index: 200; display: none;
        flex-direction: column; justify-content: center; align-items: center; color: white;
    }
    #countdown-clock { font-size: 140px; font-weight: 800; color: var(--accent-red); }

    #copyright-notice { 
        position: absolute; bottom: 8px; right: 12px; font-size: 4pt; 
        color: rgba(255,255,255,0.4); z-index: 100; text-align: right; 
        font-weight: 500; text-transform: uppercase;
    }
</style>
</head>
<body>

<canvas id="mainCanvas"></canvas>

<div id="setup-panel">
    <h1>Werner Institute</h1>
    <div class="clinical-overview">
        "Multi-Vector Washout Protocol." Use <strong>Single Click</strong> to Pause and <strong>Double Click</strong> to Reset. Vection target jumping enabled every 5s.
    </div>
    
    <div class="control-grid">
        <div class="control-item">
            <label>Training Mode</label>
            <select id="mode-select">
                <option value="circular">Circular Dots</option>
                <option value="linear">Linear Stripes</option>
            </select>
        </div>

        <div class="control-item" id="dot-dir-box">
            <label>Dot Direction</label>
            <select id="dot-dir">
                <option value="1">Clockwise</option>
                <option value="-1">Counter-Clockwise</option>
            </select>
        </div>

        <div class="control-item" id="stripe-dir-box" style="display:none;">
            <label>Stripe Direction</label>
            <select id="stripe-dir">
                <option value="rl">Right to Left</option>
                <option value="lr">Left to Right</option>
                <option value="tb">Top to Bottom</option>
                <option value="bt">Bottom to Top</option>
            </select>
        </div>

        <div class="control-item">
            <label>Speed (0-100 deg/sec)</label>
            <input type="number" id="speed-input" value="30" min="0" max="100">
        </div>

        <div class="control-item">
            <label>Total Lines (1-20)</label>
            <input type="number" id="line-count" value="12" min="1" max="20">
        </div>

        <div class="control-item">
            <label>Component Size (mm)</label>
            <input type="number" id="size-input" value="15" min="1" max="100">
        </div>

        <div class="control-item">
            <label>Prep Delay (0-30s)</label>
            <input type="number" id="delay-input" value="20" min="0" max="30">
        </div>
    </div>

    <button id="start-btn">Initialize Protocol</button>
</div>

<div id="prep-overlay">
    <div style="font-size: 24px; font-weight: 800; letter-spacing: 4px;">WERNER INSTITUTE</div>
    <div id="countdown-clock">20</div>
</div>

<div id="copyright-notice">© 2026 Werner Institute, All Rights Reserved.</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const setupPanel = document.getElementById('setup-panel');
    const modeSelect = document.getElementById('mode-select');
    const dotDirBox = document.getElementById('dot-dir-box');
    const stripeDirBox = document.getElementById('stripe-dir-box');
    
    let width, height, centerX, centerY, maxRadius, centralVoidRadius;
    let dots = [];
    let isActive = false, isPaused = false, lastTime = 0;
    let targetPos = { x: 0, y: 0 }, lastJumpTime = 0;

    let mode, dotDir, stripeDir, speed, size, userLines, displayLines, prepDelay;

    // Toggle visibility of directions based on mode
    modeSelect.addEventListener('change', () => {
        if (modeSelect.value === 'circular') {
            dotDirBox.style.display = 'flex';
            stripeDirBox.style.display = 'none';
        } else {
            dotDirBox.style.display = 'none';
            stripeDirBox.style.display = 'flex';
        }
    });

    function initDots() {
        dots = [];
        for (let i = 0; i < 1500; i++) {
            dots.push({
                angle: Math.random() * Math.PI * 2,
                distance: centralVoidRadius + Math.random() * (maxRadius - centralVoidRadius),
                color: ['#ff3b3b', '#3bff3b', '#3b3bff', '#ffff3b', '#ff3bff', '#ffffff'][Math.floor(Math.random() * 6)]
            });
        }
    }

    function moveTarget() {
        const margin = Math.min(width, height) * 0.28;
        const quadrants = [
            { x: centerX - margin, y: centerY - margin },
            { x: centerX + margin, y: centerY - margin },
            { x: centerX - margin, y: centerY + margin },
            { x: centerX + margin, y: centerY + margin }
        ];
        targetPos = quadrants[Math.floor(Math.random() * quadrants.length)];
        lastJumpTime = performance.now();
    }

    function drawSmiley(x, y, r) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "#FFD700";
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "black"; ctx.lineWidth = 6; ctx.stroke();
        ctx.fillStyle = "black";
        ctx.beginPath(); ctx.arc(-r/3, -r/4, r/8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(r/3, -r/4, r/8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, r/10, r/1.6, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
        ctx.restore();
    }

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        centerX = width / 2; centerY = height / 2;
        maxRadius = Math.sqrt(centerX**2 + centerY**2);
        centralVoidRadius = Math.min(width, height) * 0.22;
        if (!isActive) initDots();
    }

    window.addEventListener('resize', resize);
    canvas.addEventListener('click', () => { if (isActive) { isPaused = !isPaused; if (!isPaused) lastTime = performance.now(); } });
    canvas.addEventListener('dblclick', () => location.reload());

    function draw(timestamp) {
        if (!isActive || isPaused) { if (isActive && isPaused) requestAnimationFrame(draw); return; }
        const dt = (timestamp - lastTime) / 1000; lastTime = timestamp;
        ctx.fillStyle = 'black'; ctx.fillRect(0, 0, width, height);

        if (timestamp - lastJumpTime > 5000) moveTarget();

        if (mode === 'circular') {
            const speedRad = (speed * (Math.PI / 180));
            dots.forEach(d => {
                d.angle += (speedRad * dotDir) * dt;
                const x = centerX + Math.cos(d.angle) * d.distance;
                const y = centerY + Math.sin(d.angle) * d.distance;
                ctx.fillStyle = d.color;
                ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI*2); ctx.fill();
            });
        } else {
            ctx.fillStyle = 'white';
            const spacing = (height / displayLines);
            const moveAmt = (speed * 18 * dt);
            const totalCycle = (stripeDir === 'tb' || stripeDir === 'bt') ? height : width;
            const cycleSpacing = totalCycle / displayLines;
            const offset = (timestamp * (speed * 18 / 1000)) % cycleSpacing;

            for (let i = -1; i <= displayLines + 1; i++) {
                let pos = (i * cycleSpacing) + offset;
                if (stripeDir === 'rl') ctx.fillRect(width - pos, 0, size * 4, height);
                else if (stripeDir === 'lr') ctx.fillRect(pos, 0, size * 4, height);
                else if (stripeDir === 'tb') ctx.fillRect(0, pos, width, size * 4);
                else if (stripeDir === 'bt') ctx.fillRect(0, height - pos, width, size * 4);
            }
        }
        drawSmiley(targetPos.x, targetPos.y, 95);
        requestAnimationFrame(draw);
    }

    document.getElementById('start-btn').addEventListener('click', () => {
        mode = modeSelect.value;
        dotDir = parseInt(document.getElementById('dot-dir').value);
        stripeDir = document.getElementById('stripe-dir').value;
        speed = parseFloat(document.getElementById('speed-input').value);
        size = parseFloat(document.getElementById('size-input').value);
        userLines = parseInt(document.getElementById('line-count').value);
        prepDelay = parseInt(document.getElementById('delay-input').value);

        // Apply 35% reduction for vertical linear stripes
        if (mode === 'linear' && (stripeDir === 'tb' || stripeDir === 'bt')) {
            displayLines = Math.max(1, Math.floor(userLines * 0.65));
        } else {
            displayLines = userLines;
        }

        setupPanel.style.display = 'none';
        if (prepDelay > 0) {
            document.getElementById('prep-overlay').style.display = 'flex';
            let c = prepDelay;
            const t = setInterval(() => {
                c--; document.getElementById('countdown-clock').textContent = c;
                if (c <= 0) { clearInterval(t); startProtocol(); }
            }, 1000);
        } else { startProtocol(); }
    });

    function startProtocol() {
        document.getElementById('prep-overlay').style.display = 'none';
        isActive = true; moveTarget(); lastTime = performance.now(); requestAnimationFrame(draw);
    }
    resize();
});
</script>
</body>
</html>
