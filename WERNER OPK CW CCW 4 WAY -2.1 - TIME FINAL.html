<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werner Institute | Clinical Visual Integration</title>
<style>
    :root {
        --primary-navy: #0a192f;
        --clinical-blue: #1e3a8a;
        --accent-red: #cc0000;
        --neutral-bg: #f8fafc;
        --text-main: #1e293b;
        --glass: rgba(255, 255, 255, 0.98);
    }

    body, html { 
        margin: 0; padding: 0; width: 100%; height: 100%; 
        background-color: #000; overflow: hidden; 
        font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        user-select: none;
    }

    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; cursor: pointer; }

    #setup-panel { 
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
        z-index: 100; background: var(--glass); 
        padding: 40px 55px; border-radius: 20px; border: 1px solid #e2e8f0; 
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); width: 600px; color: var(--text-main);
    }

    .institute-title { margin: 0 0 15px 0; font-size: 40px; color: var(--primary-navy); font-weight: 800; }

    .control-grid {
        display: grid; grid-template-columns: 1fr 140px 60px; gap: 12px; align-items: center;
        margin-bottom: 30px; text-align: left;
    }

    .control-grid label { font-weight: 700; font-size: 14px; color: var(--primary-navy); }

    input[type="number"], input[type="color"], input[type="range"] { 
        font-size: 16px; padding: 8px; width: 100%; text-align: center; 
        border: 2px solid #cbd5e1; border-radius: 8px; outline: none;
    }

    #live-lux-container {
        position: absolute; top: 30px; left: 30px; 
        background: rgba(10, 25, 47, 0.92); backdrop-filter: blur(8px);
        padding: 15px 20px; border-radius: 12px; border-left: 6px solid var(--clinical-blue);
        color: white; z-index: 200; display: none; width: 240px;
    }
    #live-lux-val { font-size: 24px; font-weight: 800; color: #38bdf8; float: right; margin-top: -5px; }

    #info-panel { 
        position: absolute; top: 30px; right: 30px; background: var(--glass); 
        padding: 20px; border-radius: 12px; border-right: 8px solid var(--primary-navy);
        z-index: 50; min-width: 220px; display: none; text-align: right;
    }

    #pause-indicator {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: var(--accent-red); color: white; padding: 15px 30px; 
        border-radius: 10px; font-weight: 800; font-size: 24px; display: none; z-index: 60;
    }

    #prep-display, #center-display { 
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
        text-align: center; color: var(--text-main); display: none; 
        background: var(--glass); padding: 60px; border-radius: 24px; 
        z-index: 50; width: 70%;
    }

    #copyright-notice { position: absolute; bottom: 15px; right: 20px; font-size: 7pt; color: rgba(255,255,255,0.4); z-index: 10; }
</style>
</head>
<body oncontextmenu="return false;">

<div id="pause-indicator">PAUSED</div>
<canvas id="mainCanvas"></canvas>

<div id="live-lux-container">
    <label style="font-size: 11px; text-transform: uppercase; font-weight: 800; display: block; margin-bottom: 8px; color: #94a3b8;">Manual Lux Control <span id="live-lux-val">100%</span></label>
    <input type="range" id="live-lux-slider" min="0" max="100" value="100">
</div>

<div id="setup-panel">
    <h1 class="institute-title">Werner Institute</h1>
    <div class="control-grid">
        <label>Stimulus Color</label>
        <input type="color" id="color-input" value="#ffffff" style="grid-column: span 2;">

        <label>Exposure Per Phase (sec)</label>
        <input type="number" id="phase-dur-input" value="30" min="15" max="300" style="grid-column: span 2;">

        <label>Dot Size (1-20)</label>
        <input type="number" id="dot-size-input" value="12" min="1" max="20" style="grid-column: span 2;">

        <label>Start Lux (%)</label>
        <input type="range" id="init-lux" min="0" max="100" value="100">
        <span id="init-lux-txt" style="font-weight:800; color:var(--clinical-blue);">100%</span>

        <label>Lead-In Time (sec)</label>
        <input type="number" id="lead-in" value="10" min="0" max="20" style="grid-column: span 2;">

        <label>Rotation Speed (deg/s)</label>
        <input type="number" id="speed" value="30" style="grid-column: span 2;">

        <label>Base Line Density</label>
        <input type="number" id="density" value="12" style="grid-column: span 2;">
    </div>
    <button id="start-btn" style="padding:22px; font-size:24px; background:var(--primary-navy); color:white; border:none; border-radius:12px; font-weight:800; width:100%; cursor:pointer;">Initialize Protocol</button>
</div>

<div id="info-panel">
    <div style="font-size: 11px; text-transform: uppercase; color: #64748b;">Active Phase</div>
    <div id="phase-name" style="color:var(--primary-navy); font-size: 20px; font-weight: 800;">-</div>
    <div id="time-left" style="color:var(--accent-red); font-size: 24px; font-weight: 800; margin-top:10px;">-</div>
</div>

<div id="prep-display">
    <div style="font-size: 40px; font-weight: 800;">Get Ready</div>
    <div id="countdown-text" style="font-size: 60px; font-weight: 800; color: var(--accent-red);">...s</div>
</div>

<div id="center-display"></div>
<div id="copyright-notice">© 2026 Werner Institute | Brian Werner, MPT</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const setupPanel = document.getElementById('setup-panel');
    const liveLuxContainer = document.getElementById('live-lux-container');
    const liveLuxSlider = document.getElementById('live-lux-slider');
    const liveLuxValTxt = document.getElementById('live-lux-val');
    
    const initLux = document.getElementById('init-lux');
    const initLuxTxt = document.getElementById('init-lux-txt');

    const infoPanel = document.getElementById('info-panel');
    const phaseNameEl = document.getElementById('phase-name');
    const timeLeftEl = document.getElementById('time-left');
    const centerDisplay = document.getElementById('center-display');
    const prepDisplay = document.getElementById('prep-display');
    const countdownTextEl = document.getElementById('countdown-text');
    const pauseIndicator = document.getElementById('pause-indicator');

    let width, height, centerX, centerY, minRadius;
    const numDots = 800;
    let dotRadius = 12;
    let dots = [];
    let fixedDot = null;
    let currentTargetInterval = -1;
    
    let rotationSpeedRad, baseLines, finalColor, finalLuxAlpha;
    let isPaused = false;
    let accumulatedTime = 0; 
    let lastFrameTimestamp = 0;
    let currentPhaseId = 'idle';

    initLux.addEventListener('input', () => {
        initLuxTxt.textContent = initLux.value + "%";
        liveLuxSlider.value = initLux.value;
        liveLuxValTxt.textContent = initLux.value + "%";
    });

    liveLuxSlider.addEventListener('input', () => {
        finalLuxAlpha = liveLuxSlider.value / 100;
        liveLuxValTxt.textContent = liveLuxSlider.value + "%";
    });

    // Each Washout set to 19s (One 4-7-8 cycle)
    let phases = [
        { id: 'prep', name: 'Preparation', duration: 10 },
        { id: 'okn-cw', name: 'OKN: Clockwise', duration: 30 },
        { id: 'wash-1', name: 'Recovery (1 Cycle)', duration: 19 },
        { id: 'okn-ccw', name: 'OKN: Counter-Clockwise', duration: 30 },
        { id: 'wash-2', name: 'Recovery (1 Cycle)', duration: 19 },
        { id: 'lin-rl', name: 'Flow: R to L', duration: 30, arrow: 'right' },
        { id: 'wash-3', name: 'Recovery (1 Cycle)', duration: 19 },
        { id: 'lin-lr', name: 'Flow: L to R', duration: 30, arrow: 'left' },
        { id: 'wash-4', name: 'Recovery (1 Cycle)', duration: 19 },
        { id: 'lin-tb', name: 'Flow: T to B', duration: 30, arrow: 'up' },
        { id: 'wash-5', name: 'Recovery (1 Cycle)', duration: 19 },
        { id: 'lin-bt', name: 'Flow: B to T', duration: 30, arrow: 'down' }
    ];

    let currentPhaseIndex = 0;

    function initDots() {
        dots = [];
        for (let i = 0; i < numDots; i++) {
            dots.push({
                angle: Math.random() * Math.PI * 2,
                distance: minRadius + Math.random() * (Math.max(width, height) * 0.8)
            });
        }
    }

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        centerX = width / 2;
        centerY = height / 2;
        minRadius = Math.max(width, height) * 0.12;
        if (currentPhaseId === 'idle') { initDots(); draw(); }
    }
    window.addEventListener('resize', resize);

    canvas.addEventListener('mousedown', (e) => {
        if (currentPhaseId === 'idle') return;
        if (e.button === 0) { 
            isPaused = !isPaused;
            pauseIndicator.style.display = isPaused ? 'block' : 'none';
        } 
        else if (e.button === 2) { 
            liveLuxContainer.style.display = (liveLuxContainer.style.display === 'block') ? 'none' : 'block';
        }
    });

    canvas.addEventListener('dblclick', () => {
        if (currentPhaseId === 'idle') return;
        location.reload(); 
    });

    function drawArrow(dir) {
        ctx.save();
        ctx.translate(centerX, centerY);
        const arrowLength = 280; const headSize = 80;
        if (dir === 'left') ctx.rotate(Math.PI);
        if (dir === 'up') ctx.rotate(-Math.PI / 2);
        if (dir === 'down') ctx.rotate(Math.PI / 2);
        ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 20;
        ctx.strokeStyle = 'white'; ctx.lineWidth = 30; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-arrowLength/2, 0); ctx.lineTo(arrowLength/2, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(arrowLength/2 - headSize, -headSize); ctx.lineTo(arrowLength/2, 0); ctx.lineTo(arrowLength/2 - headSize, headSize); ctx.stroke();
        ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 18;
        ctx.beginPath(); ctx.moveTo(-arrowLength/2, 0); ctx.lineTo(arrowLength/2, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(arrowLength/2 - headSize, -headSize); ctx.lineTo(arrowLength/2, 0); ctx.lineTo(arrowLength/2 - headSize, headSize); ctx.stroke();
        ctx.restore();
    }

    function hexToRgba(hex, alpha) {
        let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function draw() {
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, width, height);
        const phase = phases[currentPhaseIndex];
        if (!phase || currentPhaseId === 'idle') return;

        const stimulusStyle = hexToRgba(finalColor, finalLuxAlpha);

        if (phase.id.startsWith('okn')) {
            ctx.fillStyle = stimulusStyle;
            dots.forEach(dot => {
                const x = centerX + Math.cos(dot.angle) * dot.distance;
                const y = centerY + Math.sin(dot.angle) * dot.distance;
                ctx.beginPath(); ctx.arc(x, y, dotRadius, 0, Math.PI * 2); ctx.fill();
            });
            if (fixedDot) {
                ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(fixedDot.x, fixedDot.y, 25, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(fixedDot.x, fixedDot.y, 5, 0, Math.PI * 2); ctx.fill();
            }
        } else if (phase.id.startsWith('lin')) {
            ctx.fillStyle = stimulusStyle;
            const isVert = phase.id.includes('tb') || phase.id.includes('bt');
            const span = isVert ? height : width;
            
            // 40% reduction for vertical line density
            const activeLines = isVert ? Math.max(2, Math.round(baseLines * 0.60)) : baseLines;
            
            const barThickness = 100;
            const totalCycleDist = span / (activeLines - 1);
            const motionOffset = (accumulatedTime * (span / 6)) % totalCycleDist;

            for (let i = -1; i < activeLines + 1; i++) {
                let pos = (i * totalCycleDist);
                if (phase.id === 'lin-rl') ctx.fillRect(width - (pos + motionOffset), 0, barThickness, height);
                else if (phase.id === 'lin-lr') ctx.fillRect(pos + motionOffset - barThickness, 0, barThickness, height);
                else if (phase.id === 'lin-tb') ctx.fillRect(0, pos + motionOffset - barThickness, width, barThickness);
                else if (phase.id === 'lin-bt') ctx.fillRect(0, height - (pos + motionOffset), width, barThickness);
            }
            drawArrow(phase.arrow);
        }
    }

    function update(timestamp) {
        if (currentPhaseId === 'idle') return;
        if (!lastFrameTimestamp) lastFrameTimestamp = timestamp;
        let dt = (timestamp - lastFrameTimestamp) / 1000;
        lastFrameTimestamp = timestamp;

        if (!isPaused) {
            accumulatedTime += dt;
            const phase = phases[currentPhaseIndex];
            const remaining = Math.max(0, phase.duration - accumulatedTime);
            phaseNameEl.textContent = phase.name;
            timeLeftEl.textContent = `${Math.ceil(remaining)}s`;

            if (phase.id.startsWith('okn')) {
                const dir = phase.id.includes('cw') && !phase.id.includes('ccw') ? 1 : -1;
                dots.forEach(d => d.angle += (rotationSpeedRad * dir) * dt);
                if (Math.floor(accumulatedTime / 5) !== currentTargetInterval) {
                    currentTargetInterval = Math.floor(accumulatedTime / 5);
                    const angle = Math.random() * Math.PI * 2;
                    const dist = (minRadius * 1.5) + Math.random() * (Math.min(centerX, centerY) * 0.5);
                    fixedDot = { x: centerX + Math.cos(angle) * dist, y: centerY + Math.sin(angle) * dist };
                }
            }

            if (phase.id === 'prep') {
                prepDisplay.style.display = 'block'; countdownTextEl.textContent = `${Math.ceil(remaining)}s`;
            } else { prepDisplay.style.display = 'none'; }

            if (phase.id.startsWith('wash')) {
                centerDisplay.style.display = 'block';
                let cycleTime = accumulatedTime % 19;
                let instr = cycleTime < 4 ? 'Inhale' : cycleTime < 11 ? 'Hold' : 'Exhale';
                centerDisplay.innerHTML = `<div style="font-size:70px; font-weight:800; color:var(--primary-navy)">${instr}</div>`;
            } else { centerDisplay.style.display = 'none'; }

            if (accumulatedTime >= phase.duration) {
                currentPhaseIndex++; accumulatedTime = 0;
                if (currentPhaseIndex >= phases.length) location.reload();
            }
        }
        draw();
        requestAnimationFrame(update);
    }

    startBtn.addEventListener('click', () => {
        rotationSpeedRad = (parseFloat(document.getElementById('speed').value) || 30) * (Math.PI / 180);
        baseLines = parseInt(document.getElementById('density').value) || 12;
        dotRadius = parseInt(document.getElementById('dot-size-input').value) || 12;
        finalColor = document.getElementById('color-input').value;
        finalLuxAlpha = initLux.value / 100;
        
        let chosenExposure = parseFloat(document.getElementById('phase-dur-input').value) || 30;
        phases[0].duration = parseFloat(document.getElementById('lead-in').value);
        
        phases.forEach((p, i) => { 
            if(i > 0 && !p.id.includes('wash')) p.duration = chosenExposure; 
        });

        setupPanel.style.display = 'none';
        infoPanel.style.display = 'block';
        currentPhaseId = 'active';
        accumulatedTime = 0;
        lastFrameTimestamp = performance.now();
        requestAnimationFrame(update);
    });

    resize();
});
</script>
</body>
</html>
